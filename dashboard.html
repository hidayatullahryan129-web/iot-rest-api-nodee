<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#333}
.container{max-width:1000px;margin:0 auto}
h1{color:#fff;text-align:center;margin-bottom:25px;font-size:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:25px}
.card,.panel{background:#fff;border-radius:15px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.card{text-align:center;transition:transform .2s}.card:hover{transform:translateY(-5px)}
.panel{margin-bottom:25px}.panel h2{font-size:18px;margin-bottom:15px;color:#444}
.label{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px}
.value{font-size:42px;font-weight:bold;margin:10px 0;color:#667eea}.value.hot{color:#dc3545}
.unit{font-size:18px;color:#aaa}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px}
.on{background:#d4edda;color:#155724}.off{background:#f8d7da;color:#721c24}
#alert{display:none;background:#dc3545;color:#fff;padding:14px 20px;border-radius:10px;margin-bottom:20px;font-weight:600}
.controls{display:flex;gap:15px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 30px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.btn-on{background:#28a745}.btn-off{background:#dc3545}.btn-set{background:#667eea}
input[type=number]{padding:11px;border:1px solid #ccc;border-radius:10px;width:110px;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f8f9fa;color:#666;text-transform:uppercase;font-size:12px}
#log{background:#1e1e1e;color:#0f0;font-family:monospace;padding:15px;border-radius:10px;max-height:180px;overflow-y:auto;font-size:13px;line-height:1.6}
#log .error{color:#f66}#log .info{color:#6af}#log .warn{color:#fc3}
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API</h1>
  <div id="alert"></div>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card"><div class="label">Status Sensor</div><div class="value" style="font-size:22px"><span class="badge off" id="status">OFFLINE</span></div></div>
    <div class="card"><div class="label">Koneksi WebSocket</div><div class="value" style="font-size:22px"><span class="badge off" id="wsstatus">TERPUTUS</span></div></div>
  </div>

  <div class="panel">
    <h2>📈 Grafik Real-time (Chart.js)</h2>
    <canvas id="chart" height="110"></canvas>
  </div>

  <div class="panel">
    <h2>🎛️ Kontrol & Threshold</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">💡 Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">🌑 Matikan Lampu</button>
      <span style="margin-left:20px">Batas suhu (°C):</span>
      <input type="number" id="th" step="0.1" value="30">
      <button class="btn btn-set" onclick="setThreshold()">Set Threshold</button>
    </div>
  </div>

  <div class="panel">
    <h2>🕒 10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="panel"><h2>📋 Log Aktivitas</h2><div id="log"></div></div>
</div>

<script>
// ===== KONFIGURASI =====
const API_BASE = 'http://localhost:1880/api';
const WS_URL   = 'ws://localhost:1880/ws/sensor';
const API_KEY  = 'iot-secret-123';   // harus sama dengan env API_KEY di Node-RED

const $ = id => document.getElementById(id);
let hist = [], threshold = 30, lastSeen = 0;

function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// Semua request REST membawa header X-API-Key
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {'Content-Type': 'application/json', 'X-API-Key': API_KEY}
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
  return json;
}

// ===== CHART =====
const chart = new Chart($('chart'), {
  type: 'line',
  data: {labels: [], datasets: [
    {label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', tension: .3},
    {label: 'Kelembaban (%)', data: [], borderColor: '#3498db', tension: .3},
    {label: 'Batas suhu', data: [], borderColor: '#999', borderDash: [6, 4], pointRadius: 0}
  ]},
  options: {animation: false, responsive: true}
});

function redraw() {
  const d = hist.slice(-30);
  chart.data.labels = d.map(x => new Date(x.received).toLocaleTimeString());
  chart.data.datasets[0].data = d.map(x => x.suhu);
  chart.data.datasets[1].data = d.map(x => x.kelembaban);
  chart.data.datasets[2].data = d.map(() => threshold);
  chart.update();
  $('history-body').innerHTML = hist.length
    ? hist.slice(-10).reverse().map(x => `<tr><td>${new Date(x.received).toLocaleTimeString()}</td><td>${x.suhu}</td><td>${x.kelembaban}</td></tr>`).join('')
    : '<tr><td colspan="3" style="text-align:center;color:#999">Belum ada data</td></tr>';
}

function showSensor(d, over) {
  lastSeen = Date.now();
  $('suhu').textContent = d.suhu;
  $('suhu').classList.toggle('hot', !!over);
  $('kelembaban').textContent = d.kelembaban;
  $('status').textContent = 'ONLINE'; $('status').className = 'badge on';
}

function showAlert(a) {
  const el = $('alert');
  el.textContent = '⚠️ ' + a.message; el.style.display = 'block';
  log('NOTIFIKASI: ' + a.message, 'warn');
  if ('Notification' in window && Notification.permission === 'granted')
    new Notification('Peringatan Suhu', {body: a.message});
  clearTimeout(showAlert.t); showAlert.t = setTimeout(() => el.style.display = 'none', 8000);
}

// ===== WEBSOCKET (tanpa polling) =====
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('wsstatus').textContent = 'TERHUBUNG'; $('wsstatus').className = 'badge on'; log('WebSocket terhubung'); };
  ws.onclose = () => {
    $('wsstatus').textContent = 'TERPUTUS'; $('wsstatus').className = 'badge off';
    log('WebSocket terputus, mencoba lagi 3 detik...', 'error'); setTimeout(connectWS, 3000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'sensor') {
      threshold = m.threshold; hist.push(m.data);
      if (hist.length > 50) hist.shift();
      showSensor(m.data, m.alert); redraw();
    } else if (m.type === 'alert') showAlert(m);
  };
}

// ===== REST: load awal, kontrol, threshold =====
async function loadInitial() {
  try {
    const s = await api('/suhu');
    threshold = s.threshold; $('th').value = threshold;
    if (s.data && s.data.suhu !== null) showSensor(s.data, s.data.suhu > threshold);
    const h = await api('/history');
    hist = h.data || []; redraw();
    log(`Data awal dimuat (${hist.length} riwayat dari SQLite)`);
  } catch (err) { log('Gagal memuat data awal: ' + err.message, 'error'); }
}

async function kontrol(device, action) {
  try {
    await api('/kontrol', {method: 'POST', body: JSON.stringify({device, action})});
    log(`✓ Perintah terkirim: ${device} → ${action}`);
  } catch (err) { log('✗ Error kontrol: ' + err.message, 'error'); }
}

async function setThreshold() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  try {
    const r = await api('/threshold', {method: 'PUT', body: JSON.stringify({max: parseFloat($('th').value)})});
    threshold = r.threshold; redraw();
    log(`✓ Threshold diatur ke ${r.threshold}°C`);
  } catch (err) { log('✗ Gagal set threshold: ' + err.message, 'error'); }
}

// Status offline jika tidak ada data > 10 detik
setInterval(() => {
  if (lastSeen && Date.now() - lastSeen > 10000) { $('status').textContent = 'OFFLINE'; $('status').className = 'badge off'; }
}, 2000);

log('Dashboard dimulai (WebSocket + REST)');
loadInitial();
connectWS();
</script>
</body>
</html>
